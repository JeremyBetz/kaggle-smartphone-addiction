[project]
name = "kaggle-smartphone-addiction"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jeremy Betz", email = "jeremy@betz.mx" }
]
requires-python = ">=3.13"
dependencies = [
    "jupyter>=1.1.1",
    "kaggle>=2.2.4",
    "kagglehub>=1.0.2",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
]

[project.scripts]
kaggle-smartphone-addiction = "kaggle_smartphone_addiction:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
