[project]
name = "kaggle-smartphone-addiction"
version = "0.1.0"
description = "Reusable experimentation infrastructure for Kaggle Playground Series S6E8"
readme = "README.md"
authors = [
    { name = "Jeremy Betz", email = "jeremy@betz.mx" }
]
requires-python = ">=3.13"
dependencies = [
    "catboost>=1.2.10",
    "jupyter>=1.1.1",
    "kaggle>=2.2.4",
    "kagglehub>=1.0.2",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "xgboost>=3.4.1",
]

[project.scripts]
kaggle-smartphone-addiction = "kaggle_smartphone_addiction.run_baseline:main"
compare-models = "kaggle_smartphone_addiction.model_comparison:main"
evaluate-blend = "kaggle_smartphone_addiction.blending:main"
diagnose-features = "kaggle_smartphone_addiction.feature_diagnostics:main"
tune-boosters = "kaggle_smartphone_addiction.boosting_tuning:main"
analyze-convergence = "kaggle_smartphone_addiction.convergence:main"
evaluate-diversity = "kaggle_smartphone_addiction.ensemble_diversity:main"
validate-repeated-cv = "kaggle_smartphone_addiction.repeated_validation:main"
discover-features = "kaggle_smartphone_addiction.feature_discovery:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
